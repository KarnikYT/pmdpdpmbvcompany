<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vozový park - DPMB & PMDP vCompany</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandGreen: '#10B981',
            brandRed: '#E11D48',
            brandDark: '#0F172A',
            brandCard: '#1E293B',
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .light .glass-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-300 light:bg-slate-50 light:text-slate-800" id="bodyElement">

  <!-- Navigace -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800/50 backdrop-blur-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brandRed to-brandGreen p-0.5 shadow-lg shadow-brandRed/20 group-hover:scale-105 transition-transform">
          <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-rose-500">
            DP
          </div>
        </div>
        <div>
          <h1 class="font-extrabold text-base leading-tight tracking-wide text-white light:text-slate-900">DPMB & PMDP</h1>
          <p class="text-[11px] text-emerald-400 font-semibold tracking-wider uppercase">vCompany Nid's Transit</p>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700 transition">
          <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
        </button>
        <a href="index.html" class="px-4 py-2 text-sm font-semibold rounded-xl bg-slate-800 text-slate-200 hover:bg-slate-700 transition">
          <i class="fa-solid fa-arrow-left mr-1.5"></i> Zpět
        </a>
      </div>
    </div>
  </header>

  <!-- Hlavní obsah -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 space-y-8">

    <!-- Hero Nadpis -->
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-semibold mb-2">
          <i class="fa-solid fa-bus"></i> Flotila vCompany
        </div>
        <h2 class="text-3xl font-extrabold text-white light:text-slate-900">Přehled Vozidel</h2>
        <p class="text-slate-400 text-sm mt-1">Kompletní seznam provozovaných autobusů a trolejbusů v Nid's Buses & Trams.</p>
      </div>

      <!-- Filtry a hledání -->
      <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="vehicleSearch" placeholder="Hledat vozidlo..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition">
        </div>
        
        <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800 w-full sm:w-auto">
          <button id="filterAll" class="filter-btn active px-3.5 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition">Vše</button>
          <button id="filterBus" class="filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Autobusy (BUS)</button>
          <button id="filterTBus" class="filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Trolejbusy (T-BUS)</button>
        </div>
      </div>
    </div>

    <!-- Sekce BUS Vehicles -->
    <div class="space-y-4 vehicle-section" id="busSection">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-sm">
          <i class="fa-solid fa-bus-simple"></i>
        </div>
        <h3 class="text-xl font-bold text-white light:text-slate-900">BUS Vehicles (Autobusy)</h3>
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 font-bold border border-slate-700" id="busCount">18 vozidel</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="busGrid">
        <!-- Zde se dynamicky vygenerují autobusy -->
      </div>
    </div>

    <!-- Sekce T-BUS Vehicles -->
    <div class="space-y-4 vehicle-section pt-6 border-t border-slate-800/80" id="tbusSection">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h3 class="text-xl font-bold text-white light:text-slate-900">T-BUS Vehicles (Trolejbusy)</h3>
        <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 font-bold border border-slate-700" id="tbusCount">12 vozidel</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="tbusGrid">
        <!-- Zde se dynamicky vygenerují trolejbusy -->
      </div>
    </div>

  </main>

  <script>
    // Data vozového parku
    const busVehicles = [
      { name: "SOR BN12", manufacturer: "SOR", type: "Standardní MIDI/Low-entry" },
      { name: "SOR BN 8.5", manufacturer: "SOR", type: "Midibus Low-entry" },
      { name: "SOR BN8.5", manufacturer: "SOR", type: "Midibus Low-entry" },
      { name: "Solaris Alpino 8.9", manufacturer: "Solaris", type: "Midibus Low-floor" },
      { name: "Solaris Urbino 12 III", manufacturer: "Solaris", type: "Standardní sólo" },
      { name: "Solaris Urbino 12 IV", manufacturer: "Solaris", type: "Standardní sólo" },
      { name: "Solaris Urbino 15 II", manufacturer: "Solaris", type: "Třínápravový sólo" },
      { name: "Solaris Urbino 18 III", manufacturer: "Solaris", type: "Kloubový autobus" },
      { name: "Solaris Urbino 18 IV", manufacturer: "Solaris", type: "Kloubový autobus" },
      { name: "Karosa B951E", manufacturer: "Karosa", type: "Městský sólo autobus" },
      { name: "Ikarus 260.01", manufacturer: "Ikarus", type: "Historický sólo" },
      { name: "Ikarus 260.37", manufacturer: "Ikarus", type: "Historický sólo" },
      { name: "Ikarus 266", manufacturer: "Ikarus", type: "Historický příměstský/městský" },
      { name: "Ikarus 280.01", manufacturer: "Ikarus", type: "Historický kloubový" },
      { name: "Ikarus 280.37", manufacturer: "Ikarus", type: "Historický kloubový" },
      { name: "Renault Citybus 12", manufacturer: "Renault", type: "Nízkopodlažní sólo" },
      { name: "Renault Citybus 18", manufacturer: "Renault", type: "Nízkopodlažní kloubový" },
      { name: "MAN Lion’s City A21", manufacturer: "MAN", type: "Standardní sólo" },
      { name: "Mercedes-Benz O530", manufacturer: "Mercedes-Benz", type: "Citaro sólo" }
    ];

    const tbusVehicles = [
      { name: "14Tr", manufacturer: "Škoda", type: "Legendární vysokopodlažní" },
      { name: "26Tr", manufacturer: "Škoda / Solaris", type: "Nízkopodlažní sólo" },
      { name: "27Tr", manufacturer: "Škoda / Solaris", type: "Nízkopodlažní kloubový" },
      { name: "28Tr", manufacturer: "Škoda / Solaris", type: "Třínápravový trolejbus" },
      { name: "Škoda 32Tr", manufacturer: "Škoda / SOR", type: "Nízkopodlažní sólo (SOR NS 12)" },
      { name: "Škoda 36Tr", manufacturer: "Škoda / TNS", type: "Nízkopodlažní sólo (TNS 12)" },
      { name: "ZiU-9", manufacturer: "ZiU", type: "Historický sovětský" },
      { name: "ZiU-11.1", manufacturer: "ZiU", type: "Historický trolejbus" },
      { name: "ZiU-11", manufacturer: "ZiU", type: "Historický trolejbus" },
      { name: "Trollino 12 IV", manufacturer: "Solaris", type: "Moderní sólo trolejbus" },
      { name: "Trollino 18 IV", manufacturer: "Solaris", type: "Moderní kloubový trolejbus" },
      { name: "Ikarus 280T", manufacturer: "Ikarus / Ganz", type: "Historický kloubový trolejbus" }
    ];

    function renderVehicles() {
      const busGrid = document.getElementById('busGrid');
      const tbusGrid = document.getElementById('tbusGrid');

      busGrid.innerHTML = busVehicles.map(v => `
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between border-l-4 border-l-rose-500 hover:scale-[1.02] transition-all duration-200">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/20">${v.manufacturer}</span>
              <i class="fa-solid fa-bus text-slate-500 text-xs"></i>
            </div>
            <h4 class="font-extrabold text-base text-white light:text-slate-900">${v.name}</h4>
            <p class="text-xs text-slate-400 mt-1">${v.type}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
            <span>Aktivní ve flotile</span>
            <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle text-[8px] mr-1"></i>Dostupné</span>
          </div>
        </div>
      `).join('');

      tbusGrid.innerHTML = tbusVehicles.map(v => `
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between border-l-4 border-l-emerald-500 hover:scale-[1.02] transition-all duration-200">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${v.manufacturer}</span>
              <i class="fa-solid fa-bolt text-amber-400 text-xs"></i>
            </div>
            <h4 class="font-extrabold text-base text-white light:text-slate-900">${v.name}</h4>
            <p class="text-xs text-slate-400 mt-1">${v.type}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
            <span>Trolejové vedení</span>
            <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle text-[8px] mr-1"></i>Dostupné</span>
          </div>
        </div>
      `).join('');

      document.getElementById('busCount').innerText = `${busVehicles.length} vozidel`;
      document.getElementById('tbusCount').innerText = `${tbusVehicles.length} vozidel`;
    }

    renderVehicles();

    // Vyhledávání a filtry
    const searchInput = document.getElementById('vehicleSearch');
    const busSection = document.getElementById('busSection');
    const tbusSection = document.getElementById('tbusSection');

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      
      document.querySelectorAll('#busGrid > div').forEach((card, idx) => {
        const text = busVehicles[idx].name.toLowerCase() + " " + busVehicles[idx].manufacturer.toLowerCase();
        card.style.display = text.includes(term) ? 'flex' : 'none';
      });

      document.querySelectorAll('#tbusGrid > div').forEach((card, idx) => {
        const text = tbusVehicles[idx].name.toLowerCase() + " " + tbusVehicles[idx].manufacturer.toLowerCase();
        card.style.display = text.includes(term) ? 'flex' : 'none';
      });
    });

    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('bg-emerald-500', 'text-slate-950');
          b.classList.add('text-slate-400');
        });
        btn.classList.add('bg-emerald-500', 'text-slate-950');
        btn.classList.remove('text-slate-400');

        if (btn.id === 'filterBus') {
          busSection.style.display = 'block';
          tbusSection.style.display = 'none';
        } else if (btn.id === 'filterTBus') {
          busSection.style.display = 'none';
          tbusSection.style.display = 'block';
        } else {
          busSection.style.display = 'block';
          tbusSection.style.display = 'block';
        }
      });
    });

    // Dark / Light přepínač
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const body = document.getElementById('bodyElement');

    themeToggleBtn.addEventListener('click', () => {
      if (body.classList.contains('dark')) {
        body.classList.remove('dark');
        body.classList.add('light');
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
      } else {
        body.classList.remove('light');
        body.classList.add('dark');
        themeIcon.classList.remove('fa-sun');
        themeIcon.classList.add('fa-moon');
      }
    });
  </script>
</body>
</html>
